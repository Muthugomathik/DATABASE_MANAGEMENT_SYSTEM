<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<title>Add Asset</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #1e1e2f, #2c2c3e);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    width: 350px;
    padding: 25px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
}

input {
    color: white !important;
    background-color: #1e1e2f !important;
    border: 1px solid #555;
}

input::placeholder {
    color: #ccc !important;
}

.btn-custom {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border: none;
    color: white;
}
body {
    color: white;
}

h1, h2, h3, h4, h5, p, label {
    color: white !important;
}

input, select {
    background-color: #1e1e2f !important;
    color: white !important;
    border: 1px solid #555 !important;
}

input::placeholder {
    color: #bbb !important;
}
</style>
</head>
<body>
<div class="card">
<h3 style="color: #ffffff; font-weight:bold;">Add Asset</h3>
<form method="POST">
<input class="form-control mb-3" name="name" placeholder="Asset Name" required>
<input class="form-control mb-3" name="category" placeholder="Category" required>
<input class="form-control mb-3" name="cost" placeholder="Cost" required>
<button class="btn btn-custom w-100">Add Asset</button>
</form>
<div class="text-center mt-3">
<a href="/admin_dashboard" class="btn btn-secondary">Back</a>
</div>
</div>
</body>
</html>
