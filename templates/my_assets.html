<!DOCTYPE html>
<html>
<head>
    <title>My Assets</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 70%;
            background: #1e293b;
        }

        th, td {
            padding: 10px;
            border: 1px solid #334155;
        }

        th {
            background: #3b82f6;
        }

        a {
            color: white;
            text-decoration: none;
            background: red;
            padding: 8px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>My Assigned Assets</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Cost</th>
        <th>Status</th>
    </tr>

    {% for asset in assets %}
    <tr>
        <td>{{ asset[0] }}</td>
        <td>{{ asset[1] }}</td>
        <td>{{ asset[2] }}</td>
        <td>{{ asset[3] }}</td>
        <td>{{ asset[4] }}</td>
    </tr>
    {% endfor %}
</table>
<br>
<a href="/employee_dashboard">Back</a>

</body>
</html>
