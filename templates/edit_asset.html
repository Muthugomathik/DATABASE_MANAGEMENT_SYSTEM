<!DOCTYPE html>
<html>
<head>
<title>Edit Asset</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #1e1e2f, #2c2c3e);
    color: white;
}
.card {
    background: #2c2c3e;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
}
label {
    margin-top: 10px;
    font-weight: bold;
}
body {
    color: white;
}
h1, h2, h3, h4, h5, p, label {
    color: white !important;
}
input, select {
    background-color: #1e1e2f !important;
    color: white !important;
    border: 1px solid #555 !important;
}
input::placeholder {
    color: #bbb !important;
}
</style>
</head>
<body>
<div class="container mt-5 d-flex justify-content-center">
<div class="card col-md-6">
<h3 class="text-center mb-4">Edit Asset</h3>
<form method="POST">
<label >Asset Name</label>
<input class="form-control mb-2" name="name" value="{{asset[1]}}" required>
<label>Category</label>
<input class="form-control mb-2" name="category" value="{{asset[2]}}" required>
<label>Cost</label>
<input class="form-control mb-3" name="cost" value="{{asset[3]}}" required>
<button class="btn btn-success w-100">Update Asset</button>
</form>
<div class="text-center mt-3">
<button onclick="history.back()" class="btn btn-secondary">Back</button>
</div>
</div>
</div>
</body>
</html>
